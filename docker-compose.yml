version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres-spring
    restart: always

    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: